version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: gym_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Madrid
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: gym_nginx_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    entrypoint: []
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf << 'NGINXCONF'
        upstream gymapi {
          server api:8000;
        }
        server {
          listen 80;
          server_name _;
          location / {
            root /usr/share/nginx/html;
            index login.html;
            try_files $uri $uri/ /login.html;
          }
          location /api/ {
            proxy_pass http://gymapi;
            proxy_set_header Host $host;
          }
        }
        NGINXCONF
        nginx -g 'daemon off;'

  api:
    build: .
    container_name: gym_api_prod
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-GymAPI}
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: gunicorn main:app -k uvicorn.workers.UvicornWorker --workers 3 --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -

volumes:
  postgres_data_prod:

networks:
  default:
    name: gym_network_prod
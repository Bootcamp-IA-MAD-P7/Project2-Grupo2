version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: gym_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_db}
      POSTGRES_USER: ${DB_USER:-gymuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gympassword}
      TZ: Europe/Madrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gymuser} -d ${DB_NAME:-gym_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: gym_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      TZ: Europe/Madrid
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Running Alembic migrations...' &&
        alembic upgrade head &&
        echo '🚀 Starting FastAPI...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:

networks:
  default:
    name: gym_network

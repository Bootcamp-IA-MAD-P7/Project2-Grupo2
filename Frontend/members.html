  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="index.html">Iron Pulse</a>

        <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
        >
        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
            <li class="nav-item"><a class="nav-link" href="plans.html">Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
            <li class="nav-item"><a class="nav-link" href="payments.html">Payments</a></li>
            <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
            <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
        </ul>
        </div>
    </div>
    </nav>

  <!-- CONTENIDO -->
  <div class="page-container">
    <h1 class="page-title">Members</h1>
    <p class="page-subtitle">Manage and consult gym members.</p>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-lg"></i> Add Member
      </button>
    </div>

    <div id="alert-container"></div>

    <div class="content-card">
      <div id="members-table-container">
        <!-- La tabla se carga aquí desde members.js -->
      </div>
    </div>
  </div>

  <!-- MODAL: Añadir socio -->
  <div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">First Name *</label>
            <input type="text" class="form-control" id="memberFirstName" placeholder="e.g. Juan">
          </div>
          <div class="mb-3">
            <label class="form-label">Last Name *</label>
            <input type="text" class="form-control" id="memberLastName" placeholder="e.g. García">
          </div>
          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" id="memberEmail" placeholder="e.g. juan@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" id="memberPhone" placeholder="e.g. 600123456">
          </div>
          <div id="form-error" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="submitAddMember()">Save Member</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/members.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Pulse | Members</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container-fluid navbar-container">
        <a class="navbar-brand brand" href="index.html" aria-label="Iron Pulse home">
          <img
            src="assets/img/iron-pulse-logo.png"
            alt="Iron Pulse"
            class="navbar-logo"
          />
        </a>

        <button
          class="navbar-toggler custom-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#ironPulseNavbar"
          aria-controls="ironPulseNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="ironPulseNavbar">
          <ul class="navbar-nav navigation-menu ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="members.html">Members</a></li>
            <li class="nav-item"><a class="nav-link" href="plans.html">Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="memberships.html">Memberships</a></li>
            <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
            <li class="nav-item"><a class="nav-link" href="payments.html">Payments</a></li>
            <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
            <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="localStorage.clear(); window.location.href='login.html'">
              <i class="bi bi-box-arrow-right"></i> Logout
             </a>
          </ul>

          <div class="navbar-actions">
            <a class="nav-cta" href="classes.html">
              Manage classes
              <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="dashboard-card">
      <div class="card-header-row">
        <div>
          <p class="section-kicker">Members</p>
          <h1 class="page-title">Members</h1>
          <p class="page-subtitle">Manage and consult gym members.</p>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="bi bi-plus-lg"></i>
          Add Member
        </button>
      </div>

      <div id="alert-container"></div>

      <div class="content-card">
        <div id="members-table-container"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <span class="footer-pulse-icon">
        <i class="bi bi-activity"></i>
      </span>
      <span>Iron Pulse</span>
    </div>

    <div class="footer-values">
      <div class="footer-value">
        <i class="bi bi-activity"></i>
        <span>Power</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-shield-fill-check"></i>
        <span>Resilience</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-bullseye"></i>
        <span>Focus</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-people-fill"></i>
        <span>Community</span>
      </div>
    </div>
  </footer>

  <div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">First Name *</label>
            <input
              type="text"
              class="form-control"
              id="memberFirstName"
              placeholder="e.g. Juan"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Last Name *</label>
            <input
              type="text"
              class="form-control"
              id="memberLastName"
              placeholder="e.g. Garcia"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input
              type="email"
              class="form-control"
              id="memberEmail"
              placeholder="e.g. juan@email.com"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
              type="text"
              class="form-control"
              id="memberPhone"
              placeholder="e.g. 600123456"
            />
          </div>

          <div id="form-error" class="alert alert-danger d-none"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>

          <button type="button" class="btn btn-primary" onclick="submitAddMember()">
            Save Member
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/members.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Pulse | Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="main-content">
    <section class="hero-section" aria-labelledby="login-title">
      <div class="hero-content">
        <a class="navbar-brand brand mb-4 d-inline-block" href="index.html" aria-label="Iron Pulse home">
          <img
            src="assets/img/iron-pulse-logo.png"
            alt="Iron Pulse"
            class="navbar-logo"
          />
        </a>

        <div class="hero-pulse-mark" aria-hidden="true">
          <i class="bi bi-shield-lock-fill"></i>
        </div>

        <p class="hero-kicker">Secure access</p>

        <h1 id="login-title" class="hero-title">
          Sign in to Iron Pulse.
        </h1>

        <p class="hero-description">
          Access members, plans, classes, payments, attendance and reports from
          one operational dashboard.
        </p>
      </div>

      <aside class="hero-panel" aria-label="Login form">
        <div class="panel-header">
          <span class="panel-label">Account login</span>
          <span class="live-indicator">Ready</span>
        </div>

        <div id="login-error" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter your username"
            autocomplete="username"
          />
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <button class="primary-action w-100" type="button" onclick="handleLoginClick()">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Sign In</span>
        </button>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <span class="footer-pulse-icon">
        <i class="bi bi-activity"></i>
      </span>
      <span>Iron Pulse</span>
    </div>

    <div class="footer-values">
      <div class="footer-value">
        <i class="bi bi-activity"></i>
        <span>Power</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-shield-fill-check"></i>
        <span>Resilience</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-bullseye"></i>
        <span>Focus</span>
      </div>

      <div class="footer-value">
        <i class="bi bi-people-fill"></i>
        <span>Community</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8000/api/v1";

    async function handleLoginClick() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("login-error");

      errorDiv.classList.add("d-none");
      errorDiv.textContent = "";

      if (!username || !password) {
        errorDiv.textContent = "Please enter both username and password.";
        errorDiv.classList.remove("d-none");
        return;
      }

      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);

      try {
        const response = await fetch(`${API_BASE_URL}/auth/token`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "Invalid credentials");
        }

        const data = await response.json();

        localStorage.setItem("ironPulseToken", data.access_token);
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("token_type", data.token_type);
        localStorage.setItem("username", username);

        window.location.href = "index.html";
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove("d-none");
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleLoginClick();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Pulse | Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container-fluid navbar-container">
        <a class="navbar-brand brand" href="index.html" aria-label="Iron Pulse home">
          <img src="assets/img/iron-pulse-logo.svg" alt="Iron Pulse" class="navbar-logo" />
        </a>
        <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#ironPulseNavbar" aria-controls="ironPulseNavbar"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="ironPulseNavbar">
          <ul class="navbar-nav navigation-menu ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
            <li class="nav-item"><a class="nav-link active" href="plans.html">Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="memberships.html">Memberships</a></li>
            <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
            <li class="nav-item"><a class="nav-link" href="payments.html">Payments</a></li>
            <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
            <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="page-hero">
      <div class="page-copy">
        <p class="section-kicker">Plans</p>
        <h1>Subscription plans</h1>
        <p class="page-description">
          Create and manage membership plans, prices, duration and availability.
        </p>
      </div>
      <a class="primary-action" href="index.html">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </section>

    <div id="alert-container"></div>

    <section class="module-grid">
      <!-- FORM: New plan -->
      <article class="module-panel">
        <h2>New plan</h2>
        <div class="module-form">
          <div class="form-row">
            <label for="planName">Plan name</label>
            <input id="planName" type="text" class="form-control" maxlength="100" required />
          </div>
          <div class="form-row">
            <label for="planPrice">Price</label>
            <input id="planPrice" type="number" class="form-control" min="0" step="0.01" required />
          </div>
          <div class="form-row">
            <label for="planDuration">Duration (days)</label>
            <input id="planDuration" type="number" class="form-control" min="1" value="30" required />
          </div>
          <div class="form-row">
            <label for="planDescription">Description</label>
            <textarea id="planDescription" class="form-control" maxlength="500"></textarea>
          </div>
          <div id="form-error" class="alert alert-danger d-none"></div>
          <button class="form-button btn btn-primary mt-2" type="button" onclick="submitAddPlan()">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Save plan</span>
          </button>
        </div>
      </article>

      <!-- TABLE: Available plans -->
      <article class="module-panel">
        <div class="card-header-row">
          <div>
            <p class="section-kicker">Catalog</p>
            <h2>Available plans</h2>
          </div>
          <button class="btn btn-outline-secondary btn-sm" onclick="loadPlans()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
        <!-- plans.js writes here -->
        <div id="plans-table-container"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/plans.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Pulse | Plans</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container-fluid navbar-container">
        <a class="navbar-brand brand" href="index.html" aria-label="Iron Pulse home">
          <img
            src="assets/img/iron-pulse-logo.svg"
            alt="Iron Pulse"
            class="navbar-logo"
          />
        </a>

        <button
          class="navbar-toggler custom-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#ironPulseNavbar"
          aria-controls="ironPulseNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="ironPulseNavbar">
          <ul class="navbar-nav navigation-menu ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="members.html">Members</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="plans.html">Plans</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="classes.html">Classes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="payments.html">Payments</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="attendance.html">Attendance</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reports.html">Reports</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="page-hero">
      <div class="page-copy">
        <p class="section-kicker">Plans</p>
        <h1>Subscription plans</h1>
        <p class="page-description">
          Create and manage membership plans, prices, duration and availability.
        </p>
      </div>

      <a class="primary-action" href="index.html">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </section>

    <section class="module-grid">
      <article class="module-panel">
        <h2>New plan</h2>

        <form class="module-form" data-api-form="/plans/">
          <div class="form-row">
            <label for="name">Plan name</label>
            <input id="name" name="name" type="text" maxlength="100" required />
          </div>

          <div class="form-row">
            <label for="price">Price</label>
            <input
              id="price"
              name="price"
              type="number"
              min="0"
              step="0.01"
              data-cast="number"
              required
            />
          </div>

          <div class="form-row">
            <label for="duration_days">Duration days</label>
            <input
              id="duration_days"
              name="duration_days"
              type="number"
              min="1"
              value="30"
              data-cast="number"
              required
            />
          </div>

          <div class="form-row">
            <label for="description">Description</label>
            <textarea id="description" name="description" maxlength="500"></textarea>
          </div>

          <div class="form-row">
            <label for="active">Active plan</label>
            <select id="active" name="active" data-cast="boolean">
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>

          <button class="form-button" type="submit">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Save plan</span>
          </button>

          <span class="kpi-note" data-form-status></span>
        </form>
      </article>

      <article class="module-panel">
        <div class="card-header-row">
          <div>
            <p class="section-kicker">Catalog</p>
            <h2>Available plans</h2>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="dashboard-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Plan</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Active</th>
              </tr>
            </thead>

            <tbody
              id="plans-table-body"
              data-api-table="/plans/?limit=100"
              data-columns="id,name,price,duration_days,active"
            >
              <tr>
                <td colspan="5" class="empty-table-message">
                  No plans have been loaded yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/plans.js"></script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="index.html">Iron Pulse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="plans.html">Plans</a></li>
          <li class="nav-item"><a class="nav-link" href="memberships.html">Memberships</a></li>
          <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
          <li class="nav-item"><a class="nav-link active" href="payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="page-container">
    <h1 class="page-title">Payments</h1>
    <p class="page-subtitle">Control payments associated with members and memberships.</p>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-lg"></i> Register Payment
      </button>
      <button class="btn btn-outline-secondary" onclick="loadPayments()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>

    <div id="alert-container"></div>

    <div class="content-card">
      <div id="payments-table-container"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="addPaymentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Register Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Membership ID *</label>
            <input type="number" class="form-control" id="paymentMembershipId" placeholder="e.g. 1">
          </div>

          <div class="mb-3">
            <label class="form-label">Amount (€) *</label>
            <input type="number" step="0.01" class="form-control" id="paymentAmount" placeholder="e.g. 49.99">
          </div>

          <div class="mb-3">
            <label class="form-label">Payment Method *</label>
            <select class="form-select" id="paymentMethod">
              <option value="card">Card</option>
              <option value="cash">Cash</option>
              <option value="transfer">Transfer</option>
              <option value="bizum">Bizum</option>
              <option value="direct_debit">Direct Debit</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="paymentStatus">
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
              <option value="failed">Failed</option>
              <option value="refunded">Refunded</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Reference</label>
            <input type="text" class="form-control" id="paymentReference" placeholder="e.g. TXN-001, receipt number...">
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="paymentNotes" rows="2" placeholder="e.g. Monthly fee June 2026"></textarea>
          </div>

          <div id="form-error" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="submitAddPayment()">Save Payment</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>

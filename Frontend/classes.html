</head>

        class="navbar-toggler"

  <!-- CONTENIDO -->
  <div class="page-container">
    <h1 class="page-title">Classes & Shifts</h1>
    <p class="page-subtitle">Manage available gym classes, schedules, capacity and operational availability.</p>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-lg"></i> Add Class
      </button>
      <button class="btn btn-outline-secondary" onclick="loadClasses()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>

    <div id="alert-container"></div>

    <div class="content-card">
      <div id="classes-table-container">
        <!-- La tabla se carga aquí desde classes.js -->
      </div>
    </div>
  </div>

  <!-- MODAL: Añadir clase -->
  <div class="modal fade" id="addClassModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Class</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Class Name *</label>
            <input type="text" class="form-control" id="className" placeholder="e.g. Yoga Flow">
          </div>
          <div class="mb-3">
            <label class="form-label">Date *</label>
            <input type="date" class="form-control" id="classDate">
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Start Time *</label>
              <input type="time" class="form-control" id="classStart">
            </div>
            <div class="col mb-3">
              <label class="form-label">End Time *</label>
              <input type="time" class="form-control" id="classEnd">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Capacity *</label>
            <input type="number" class="form-control" id="classCapacity" placeholder="e.g. 20">
          </div>
          <div class="mb-3">
            <label class="form-label">Trainer Name</label>
            <input type="text" class="form-control" id="classTrainer" placeholder="e.g. Laura Gómez">
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="classStatus">
              <option value="available">Available</option>
              <option value="full">Full</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div id="form-error" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="submitAddClass()">Save Class</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/classes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="index.html">Iron Pulse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="plans.html">Plans</a></li>
          <li class="nav-item"><a class="nav-link active" href="classes.html">Classes</a></li>
          <li class="nav-item"><a class="nav-link" href="payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="page-container">
    <h1 class="page-title">Classes & Shifts</h1>
    <p class="page-subtitle">Manage available gym classes, schedules, capacity and operational availability.</p>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-lg"></i> Add Class
      </button>
      <button class="btn btn-outline-secondary" onclick="loadClasses()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>

    <div id="alert-container"></div>

    <div class="content-card">
      <div id="classes-table-container"></div>
    </div>
  </div>

  <!-- MODAL: Añadir clase — campos ajustados al backend -->
  <div class="modal fade" id="addClassModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Class</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Class Name *</label>
            <input type="text" class="form-control" id="className" placeholder="e.g. Yoga Flow">
          </div>
          <div class="mb-3">
            <label class="form-label">Instructor *</label>
            <input type="text" class="form-control" id="classInstructor" placeholder="e.g. Laura Gómez">
          </div>
          <div class="mb-3">
            <label class="form-label">Day of Week *</label>
            <select class="form-select" id="classDayOfWeek">
              <option value="monday">Monday</option>
              <option value="tuesday">Tuesday</option>
              <option value="wednesday">Wednesday</option>
              <option value="thursday">Thursday</option>
              <option value="friday">Friday</option>
              <option value="saturday">Saturday</option>
              <option value="sunday">Sunday</option>
            </select>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Start Time *</label>
              <input type="time" class="form-control" id="classStart">
            </div>
            <div class="col mb-3">
              <label class="form-label">End Time *</label>
              <input type="time" class="form-control" id="classEnd">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Max Capacity *</label>
            <input type="number" class="form-control" id="classCapacity" placeholder="e.g. 20">
          </div>
          <div id="form-error" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="submitAddClass()">Save Class</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/classes.js"></script>
</body>
</html>
